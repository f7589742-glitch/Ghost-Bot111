<script>
      // 通过Native接口判断是否启用ARMS上报
      (function() {
        // 检查Native是否可用
        if (typeof window.cefQuery === 'undefined') {
          initArmsMonitor();
          return;
        }
         // 初始化ARMS专用的Native回调
         if (!window.armsMonitorCallback) {
           window.armsMonitorCallback = function(result) {
             try {
               const res = typeof result === "string" ? JSON.parse(result) : result;
               const { func } = res;
               
               // 处理IsArmsReportEnabled的回调
               if (func === 'IsArmsReportEnabled') {
                 if (res.data && res.data.disabled === 1) {
                   window.__armsInitialized = true;
                 } else {
                   initArmsMonitor();
                 }
               }
             } catch (error) {
               initArmsMonitor();
             }
           };
         }
        
        try {
           // 调用Native接口检查是否启用ARMS
           const requestData = {
             func: 'IsArmsReportEnabled',
             data: {
               cb_func: 'armsMonitorCallback'
             }
           };
          
          window.cefQuery({
            request: 'BindingPark:' + JSON.stringify(requestData)
          });
          
          // 设置超时，如果3秒内没有收到回调，默认启用监控
          setTimeout(function() {
            if (!window.__armsInitialized) {
              initArmsMonitor();
            }
          }, 1000);
          
        } catch (error) {
          initArmsMonitor();
        }
        
        function initArmsMonitor() {
          if (window.__armsInitialized) {
            return;
          }
          window.__armsInitialized = true;
